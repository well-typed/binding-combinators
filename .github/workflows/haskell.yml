name: Haskell CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  cabal-version: "3.16"

jobs:
  build-and-test:
    name: GHC ${{ matrix.ghc }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    # Combinations are listed in full rather than as a cross product plus `include`,
    # because `include` entries that collide with a base matrix key are merged by rules
    # that are easy to misread. Every version in the library's tested-with field on
    # Linux, plus one macOS row to cover the other platform.
    #
    # The library depends only on base, bytestring and hs-bindgen-runtime, so unlike
    # hs-bindgen itself there is no libclang or LLVM to install here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, ghc: "9.2.8"}
          - {os: ubuntu-latest, ghc: "9.4.8"}
          - {os: ubuntu-latest, ghc: "9.6.7"}
          - {os: ubuntu-latest, ghc: "9.8.4"}
          - {os: ubuntu-latest, ghc: "9.10.3"}
          - {os: ubuntu-latest, ghc: "9.12.2"}
          - {os: ubuntu-latest, ghc: "9.14.1"}
          - {os: macos-latest,  ghc: "9.10.3"}

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🛠️ Setup Haskell
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: ${{ env.cabal-version }}

    - name: 📝 Record the build plan
      # The plan is the cache key: it changes exactly when a dependency version or the
      # hs-bindgen source-repository-package pin changes.
      run: |
        cabal update
        cabal build all --dry-run

    - name: ♻️ Restore cache
      id: cache-restore
      uses: actions/cache/restore@v6
      env:
        key: ${{ runner.os }}-ghc-${{ steps.setup-haskell.outputs.ghc-version }}-cabal-${{ steps.setup-haskell.outputs.cabal-version }}
      with:
        path: ${{ steps.setup-haskell.outputs.cabal-store }}
        key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
        restore-keys: ${{ env.key }}-

    - name: 🏗️ Build dependencies
      run: cabal build all --only-dependencies

    - name: 💾 Save cache
      uses: actions/cache/save@v6
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      with:
        path: ${{ steps.setup-haskell.outputs.cabal-store }}
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}

    - name: 🏗️ Build
      run: cabal build all

    - name: 🧪 Test
      run: cabal test all --test-show-details=direct

  package:
    name: Package checks
    runs-on: ubuntu-latest

    # Hackage readiness: the .cabal file, the Haddock (Hackage rejects a package whose
    # documentation does not build), and the source distribution. One GHC is enough;
    # these do not vary by compiler the way the build does.
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v7

    - name: 🛠️ Setup Haskell
      id: setup-haskell
      uses: haskell-actions/setup@v2
      with:
        ghc-version: "9.10.3"
        cabal-version: ${{ env.cabal-version }}

    - name: 🔍 cabal check
      run: cabal check

    - name: 📝 Record the build plan
      run: |
        cabal update
        cabal build all --dry-run

    - name: ♻️ Restore cache
      id: cache-restore
      uses: actions/cache/restore@v6
      env:
        key: ${{ runner.os }}-package-ghc-${{ steps.setup-haskell.outputs.ghc-version }}
      with:
        path: ${{ steps.setup-haskell.outputs.cabal-store }}
        key: ${{ env.key }}-plan-${{ hashFiles('dist-newstyle/cache/plan.json') }}
        restore-keys: ${{ env.key }}-

    - name: 📚 Haddock
      run: cabal haddock all

    - name: 💾 Save cache
      uses: actions/cache/save@v6
      if: ${{ steps.cache-restore.outputs.cache-hit != 'true' }}
      with:
        path: ${{ steps.setup-haskell.outputs.cabal-store }}
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}

    - name: 📦 cabal sdist
      run: cabal sdist all
